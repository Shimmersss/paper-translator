name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Check that every version matches the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          grep -q "<artifactId>paper-translator</artifactId>" backend/pom.xml
          grep -A1 "<artifactId>paper-translator</artifactId>" backend/pom.xml | grep -q "<version>$V</version>" \
            || { echo "backend/pom.xml is not $V"; exit 1; }
          [ "$(node -p "require('./frontend/package.json').version")" = "$V" ] \
            || { echo "frontend/package.json is not $V"; exit 1; }
          grep -qx "version = \"$V\"" cli/pyproject.toml || { echo "cli/pyproject.toml is not $V"; exit 1; }
          grep -qx "__version__ = \"$V\"" cli/paper_translator_cli/__init__.py \
            || { echo "cli/paper_translator_cli/__init__.py is not $V"; exit 1; }

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Backend (tests and jar)
        working-directory: backend
        run: mvn -B -ntp package

      - name: Frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Python tests
        working-directory: backend/scripts
        run: uv run --python 3.12 --with babeldoc==0.6.2 --with bitstring==4.4.0 python -m unittest test_babeldoc_runner test_translation_completion test_pdf_ocr

      - name: CLI tests
        working-directory: cli
        run: uv run --no-project python -m unittest discover -s tests

      - name: Package
        run: |
          mkdir -p release
          (cd cli && uv run --no-project python -m paper_translator_cli.archive "$GITHUB_WORKSPACE" "$VERSION" "$GITHUB_WORKSPACE/release")
          uv build cli --wheel --out-dir release
          (cd release && sha256sum paper_translator-*.whl >> SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/paper-translator-${{ env.VERSION }}.tar.gz
            release/paper-translator-${{ env.VERSION }}.zip
            release/paper_translator-${{ env.VERSION }}-py3-none-any.whl
            release/SHA256SUMS.txt
