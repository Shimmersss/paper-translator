name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PAPER_TRANSLATOR_HOME: ${{ github.workspace }}/../pt-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Backend tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Frontend build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Python tests
        working-directory: backend/scripts
        run: |
          tests="test_babeldoc_runner test_translation_completion"
          # The OCR tests run real Tesseract; Windows runners do not ship it.
          if [ "$RUNNER_OS" != "Windows" ]; then tests="$tests test_pdf_ocr"; fi
          uv run --python 3.12 --with babeldoc==0.6.2 --with bitstring==4.4.0 python -m unittest $tests

      - name: CLI tests
        working-directory: cli
        run: uv run --no-project python -m unittest discover -s tests -v

      - name: Install the CLI
        run: |
          uv tool install --force ./cli
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: CLI smoke test (setup, start, status, doctor, stop)
        run: |
          paper-translator --version
          paper-translator setup --non-interactive --from-source --source-dir "$GITHUB_WORKSPACE" --skip-warmup --port 18080
          paper-translator start --no-browser
          paper-translator status
          curl -fsS http://127.0.0.1:18080/ -o /dev/null
          curl -fsS http://127.0.0.1:18080/api/settings | grep -q '"tier"'
          paper-translator doctor
          paper-translator stop
          if paper-translator status; then echo "still running after stop"; exit 1; fi

      - name: Show backend log on failure
        if: failure()
        run: paper-translator logs -n 200 || true

      - name: Installer (install.sh)
        if: runner.os != 'Windows'
        env:
          PAPER_TRANSLATOR_REF: ${{ github.sha }}
          PAPER_TRANSLATOR_HOME: ${{ github.workspace }}/../pt-home-installer
        run: sh install.sh --non-interactive --from-source --source-dir "$GITHUB_WORKSPACE" --skip-warmup

      - name: Installer (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PAPER_TRANSLATOR_REF: ${{ github.sha }}
          PAPER_TRANSLATOR_HOME: ${{ github.workspace }}\..\pt-home-installer
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          & .\install.ps1 --non-interactive --from-source --source-dir "$env:GITHUB_WORKSPACE" --skip-warmup

      # Mainland China mode: uv comes out of its wheel on the Aliyun PyPI mirror and the
      # command is installed with the mirror index. uv is hidden from PATH so the
      # bootstrap really runs; `setup --help` must then offer --mirror.
      - name: Installer in mirror mode (install.sh)
        if: runner.os != 'Windows'
        run: |
          home="$RUNNER_TEMP/mirror-home"
          mkdir -p "$home"
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            PAPER_TRANSLATOR_MIRROR=cn PAPER_TRANSLATOR_REF="$GITHUB_SHA" \
            sh install.sh --help > "$RUNNER_TEMP/mirror.log" 2>&1 || { cat "$RUNNER_TEMP/mirror.log"; exit 1; }
          cat "$RUNNER_TEMP/mirror.log"
          test -x "$home/.local/bin/uv"
          grep -q -- "--mirror" "$RUNNER_TEMP/mirror.log"

      - name: Installer in mirror mode (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'mirror-home'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'uv is still on PATH' }
          $env:PAPER_TRANSLATOR_MIRROR = 'cn'
          $env:PAPER_TRANSLATOR_REF = $env:GITHUB_SHA
          $log = & .\install.ps1 --help 2>&1 | Out-String
          $log
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.local\bin\uv.exe'))) { throw 'uv was not installed from the mirror' }
          if ($log -notmatch '--mirror') { throw 'setup does not offer --mirror' }
