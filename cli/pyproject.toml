[project]
name = "paper-translator"
version = "0.2.2"
description = "Install, run and update Paper Translator (layout-preserving paper translation)"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
dependencies = []

[project.scripts]
paper-translator = "paper_translator_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_translator_cli"]
